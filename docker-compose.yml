services:
  backend:
    build: .
    ports:
      - "8080:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres


  postgres:
    image: postgres:18-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
